plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.quake'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.example.quake'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1'

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    // SDL's Java classes live in the SDL submodule
    sourceSets {
        main {
            java.srcDir '../third_party/SDL/android-project/app/src/main/java'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // SDL needs the .so files extracted to disk
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
