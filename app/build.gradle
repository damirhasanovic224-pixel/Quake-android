plugins {
    id 'com.android.application'
}

// GitHub Actions passes these in; on a normal build they are empty
def tagName = System.getenv('GITHUB_REF_NAME') ?: ''
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.example.quake'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.example.quake'
        minSdk 30
        targetSdk 35
        versionCode runNumber
        versionName(tagName.startsWith('v') ? tagName.substring(1) : '0.1')

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // same key as the test builds, so a release installs over them without uninstalling
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    // SDL's Java classes live in the SDL submodule
    sourceSets {
        main {
            java.srcDir '../third_party/SDL/android-project/app/src/main/java'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // SDL needs the .so files extracted to disk
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
