name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove unused wrapper jars
        run: find . -name gradle-wrapper.jar -delete

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          validate-wrappers: false

      # keeps the same signing key between builds so updates install over the old app
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build test APK
        if: env.IS_RELEASE != 'true'
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Build release APK
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log

      - name: Put errors on the run summary page
        if: failure()
        shell: bash
        run: |
          {
            echo '### First errors'
            echo '```'
            if [ -f build.log ]; then grep -n -E "error:|CMake Error|undefined reference|FAILED|What went wrong" build.log | head -n 40 || true; fi
            echo '```'
            echo '### Last 40 lines'
            echo '```'
            if [ -f build.log ]; then tail -n 40 build.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: quake-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "quake-android-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "quake-android-${GITHUB_REF_NAME}.apk" \
            --title "Quake for Android ${GITHUB_REF_NAME}" \
            --notes "Install the APK, then copy your own pak0.pak into the Quake/id1 folder in your phone's internal storage. Game data is not included."
