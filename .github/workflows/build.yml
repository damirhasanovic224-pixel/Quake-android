name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove unused wrapper jars
        run: find . -name gradle-wrapper.jar -delete

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          validate-wrappers: false

      # keeps the same signing key between builds so updates install over the old app
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show which libraries ended up in the APK
        if: always()
        shell: bash
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1 || true)
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          {
            echo '### Libraries inside the APK'
            echo '```'
            if [ -n "$APK" ]; then unzip -l "$APK" | grep "lib/" || true; else echo "no apk built"; fi
            echo '```'
            echo '### What libmain.so needs'
            echo '```'
            if [ -n "$APK" ]; then
              unzip -p "$APK" lib/arm64-v8a/libmain.so > /tmp/libmain.so || true
              "$READELF" -d /tmp/libmain.so 2>&1 | grep -E "NEEDED|SONAME" || true
            fi
            echo '```'
            echo '### libGL files in the build folder'
            echo '```'
            find app/build app/.cxx -name 'libGL*' 2>/dev/null || true
            echo '```'
            echo '### gl4es settings seen by CMake'
            echo '```'
            for f in $(find app/.cxx -name 'gl_props_before.txt' 2>/dev/null | head -n 1); do cat "$f"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Put errors on the run summary page
        if: failure()
        shell: bash
        run: |
          {
            echo '### First errors'
            echo '```'
            grep -n -E "error:|CMake Error|undefined reference|FAILED|What went wrong" build.log | head -n 40 || true
            echo '```'
            echo '### Last 40 lines'
            echo '```'
            tail -n 40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quake-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-build-log
          path: build.log
